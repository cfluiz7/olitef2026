<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@500;900&display=swap');
        
        body { font-family: 'Inter', sans-serif; overflow: hidden; }
        
        .slide-container {
            width: 1280px;
            min-height: 720px;
            background: #FFFFFF;
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .halftone-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: radial-gradient(#1A1A1A 10%, transparent 10%);
            background-size: 20px 20px;
            opacity: 0.03;
            pointer-events: none;
        }

        .header {
            padding-top: 50px;
            padding-left: 80px;
            margin-bottom: 30px;
        }

        h2 {
            font-weight: 900;
            font-size: 60px;
            color: #1A1A1A;
            text-transform: uppercase;
        }

        .flow-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            padding-left: 80px;
            padding-right: 80px;
            margin-bottom: 30px;
        }

        .flow-box {
            padding-top: 40px;
            padding-left: 40px;
            padding-right: 40px;
            min-height: 300px;
            position: relative;
        }

        .receita-box {
            background: #F1C40F;
            color: #1A1A1A;
            border-top: 10px solid #1A1A1A;
        }

        .despesa-box {
            background: #E74C3C;
            color: #FFFFFF;
            border-top: 10px solid #1A1A1A;
        }

        .flow-box h3 {
            font-weight: 900;
            font-size: 36px;
            text-transform: uppercase;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .flow-box p {
            font-weight: 500;
            font-size: 22px;
            line-height: 1.4;
            margin-bottom: 20px;
        }

        .tag-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .tag {
            background: rgba(26, 26, 26, 0.1);
            padding: 8px 15px;
            font-weight: 900;
            font-size: 16px;
            text-transform: uppercase;
        }

        .despesa-box .tag {
            background: rgba(255, 255, 255, 0.2);
        }

        .formula-bar {
            background: #1A1A1A;
            color: #FFFFFF;
            margin-left: 80px;
            margin-right: 80px;
            padding-top: 30px;
            padding-left: 40px;
            padding-right: 40px;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .formula-text {
            font-weight: 900;
            font-size: 42px;
            text-transform: uppercase;
        }

        .formula-text span {
            color: #F1C40F;
        }

        .example-box {
            background: #FFFFFF;
            color: #1A1A1A;
            padding: 20px 30px;
            font-weight: 900;
            font-size: 24px;
            transform: rotate(1deg);
        }

        .example-box span {
            color: #E74C3C;
        }
    </style>
</head>
<body>
    <div class="slide-container">
        <div class="halftone-overlay"></div>
        
        <div class="header">
            <h2>Receita <span style="color: #E74C3C;">&</span> Despesa</h2>
        </div>

        <div class="flow-grid">
            <div class="receita-box flow-box">
                <h3><i class="fas fa-arrow-trend-up"></i> Receita</h3>
                <p>É todo o dinheiro que <strong>entra</strong> no seu bolso ou conta.</p>
                <div class="tag-list">
                    <div class="tag">Mesada</div>
                    <div class="tag">Presentes</div>
                    <div class="tag">Pequenos Trabalhos</div>
                </div>
            </div>

            <div class="despesa-box flow-box">
                <h3><i class="fas fa-arrow-trend-down"></i> Despesa</h3>
                <p>É todo o dinheiro que <strong>sai</strong> para pagar algo.</p>
                <div class="tag-list">
                    <div class="tag">Lanche</div>
                    <div class="tag">Transporte</div>
                    <div class="tag">Cinema</div>
                    <div class="tag">Material</div>
                </div>
            </div>
        </div>

        <div class="formula-bar">
            <div class="formula-text">
                Saldo = <span>Receitas</span> — Despesas
            </div>
            <div class="example-box">
                Exemplo: R$ 50 — R$ 32 = <span>R$ 18</span>
            </div>
        </div>
    </div>
</body>
</html>
