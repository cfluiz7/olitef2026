<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>OLITEF 2026 — Preparação</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <!-- HEADER -->
    <header class="topbar">
      <div class="topbar-inner">
        <div class="brand" onclick="navigate('dashboard')">
          <span class="brand-icon">🦉</span>
          <div class="brand-text"><strong>OLITEF</strong><small>Aniceto Teixeira</small></div>
        </div>
        <div class="topbar-right">
          <span class="chip">🔥 <span id="hdrXP">0</span></span>
          <span class="chip">⭐ <span id="hdrStars">0</span></span>
        </div>
      </div>
    </header>

    <!-- CONTENT AREA -->
    <main id="main-content"></main>

    <!-- BOTTOM NAV -->
    <nav class="bottom-nav">
      <button class="bn-btn active" data-nav="dashboard" onclick="navigate('dashboard')">
        <span class="bn-icon">🏠</span><span class="bn-label">Início</span>
      </button>
      <button class="bn-btn" data-nav="modules" onclick="navigate('modules')">
        <span class="bn-icon">📚</span><span class="bn-label">Conteúdos</span>
      </button>
      <button class="bn-btn" data-nav="quiz" onclick="navigate('quiz')">
        <span class="bn-icon">🎯</span><span class="bn-label">Praticar</span>
      </button>
      <button class="bn-btn" data-nav="review" onclick="navigate('review')">
        <span class="bn-icon">🔄</span><span class="bn-label">Revisar</span>
      </button>
      <button class="bn-btn" data-nav="progress" onclick="navigate('progress')">
        <span class="bn-icon">📊</span><span class="bn-label">Progresso</span>
      </button>
    </nav>
  </div>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
